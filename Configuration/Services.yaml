services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  WapplerSystems\Inquiry\:
    resource: '../Classes/*'

  # Fetched with GeneralUtility::makeInstance() by downstream finishers, which
  # only works for public services.
  WapplerSystems\Inquiry\Service\ListSnapshotService:
    public: true

  WapplerSystems\Inquiry\Form\Factory\InquiryFormFactory:
    public: true

  WapplerSystems\Inquiry\Form\Factory\QuickInquiryFormFactory:
    public: true
